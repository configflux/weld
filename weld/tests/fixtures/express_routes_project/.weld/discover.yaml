# .weld/discover.yaml for the express route fixture (ADR 0064 criterion
# 3, TypeScript / JS).
#
# Shipped (not auto-generated) so the fixture is self-describing and the
# discovered graph is reproducible byte-for-byte, mirroring the
# axum_routes_project fixture. The `express` source entry below is keyed
# to the TypeScript / JS Tier-1 ladder; shipping it keeps the fixture's
# route nodes deterministic without depending on init auto-detection.
sources:
  # express HTTP routes: route:<METHOD>:<path> nodes for handler
  # registration. Listed before the tree_sitter entry because that is the
  # order `wd init` emits; either order gives the same file node, since
  # the thin boundary-file placeholder states a weaker confidence than the
  # canonical tree_sitter node and loses the merge to it.
  - glob: "src/**/*.ts"
    type: route
    strategy: express

  # TypeScript application sources: exports, types, imports (origin-tagged).
  - glob: "src/**/*.ts"
    type: file
    strategy: tree_sitter
    language: typescript

  # Root manifest (drives import origin=external resolution for express).
  - files: ["package.json"]
    type: config
    strategy: config_file
