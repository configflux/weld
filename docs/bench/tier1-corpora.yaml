# Tier-1 corpora pin manifest (ADR 0064).
#
# This file is the machine-readable source of truth for the corpora that
# the tier-check harness runs against. Each language lists three corpora
# (desktop monorepo, framework monorepo, polyrepo workspace components)
# pinned to specific commit SHAs so harness runs are byte-reproducible.
#
# Updates are issue-tracked events; do not bump a SHA without an
# accompanying issue that records the rationale (regression check,
# security patch, new feature exercised by the bump).
#
# Schema:
#   version: int                          -- schema version (currently 1)
#   languages:
#     <lang>:
#       desktop:                          -- criterion-1 corpus
#         repo: github.com/<owner>/<repo>
#         url:  https://github.com/<owner>/<repo>
#         sha:  <40-char commit SHA>      -- or "TBD" with a comment
#         description: <short prose>
#         representativeness: <why this corpus>
#         language_files: <int|null>      -- approx file count, null when unmeasured
#         loc: <int|null>                 -- approx LOC, null when unmeasured
#       framework: <same shape>
#       polyrepo:                         -- ordered list of children
#         - { repo, url, sha, description, role }
#         workspace_template: <repo-relative path to .weld/workspaces.yaml>
#
# The synthetic polyrepo workspace is not a real upstream repo; it is the
# combination of the three children below, materialised at a host path by
# `tools/tier1_corpus.py --fetch`. The workspace_template path points to
# the skeleton `workspaces.yaml` we vendor under `tests/fixtures/tier1/`.

version: 1

languages:
  csharp:
    desktop:
      repo: github.com/ShareX/ShareX
      url: https://github.com/ShareX/ShareX
      sha: 42465d3e9bee52c780c0a905c639b9fb0a958a00
      description: ShareX desktop screenshot and capture tool (Windows Forms + WPF, multi-project solution).
      representativeness: Mature desktop application with 2k+ source files across 40+ projects; exercises classes, structs, records, enums, properties, async/await, P/Invoke, and per-language inheritance hierarchies that the criterion-1 and criterion-2 gates target.
      language_files: 2200
      loc: null
    framework:
      repo: github.com/dotnet-architecture/eShopOnWeb
      url: https://github.com/dotnet-architecture/eShopOnWeb
      sha: 4da8212117e87d808d4bbc7da6286fd2147ce606
      description: Microsoft reference web app; ASP.NET Core MVC + Razor, EF Core, xUnit/FunctionalTests, MSBuild Directory.Build.props.
      representativeness: Exercises every framework strategy declared under ADR 0056 (csharp_aspnet_routes, csharp_efcore, csharp_test_framework, csharp_msbuild_targets) in idiomatic shapes maintained by the .NET team.
      language_files: null
      loc: null
    polyrepo:
      workspace_template: tests/fixtures/tier1/csharp-polyrepo/.weld/workspaces.yaml
      children:
        - repo: github.com/ShareX/ShareX
          url: https://github.com/ShareX/ShareX
          sha: 42465d3e9bee52c780c0a905c639b9fb0a958a00
          description: Same pin as the desktop corpus; included as the largest C# repo in the workspace.
          role: desktop-app
        - repo: github.com/dotnet-architecture/eShopOnWeb
          url: https://github.com/dotnet-architecture/eShopOnWeb
          sha: 4da8212117e87d808d4bbc7da6286fd2147ce606
          description: Same pin as the framework corpus; included to exercise ASP.NET and EF Core cross-repo edges.
          role: framework-app
        - repo: github.com/JamesNK/Newtonsoft.Json
          url: https://github.com/JamesNK/Newtonsoft.Json
          sha: 4f73e74372445108d2c1bda37b36e6f5e43402e0
          description: Newtonsoft.Json (Json.NET) library; small, widely-used dependency that exercises csharp_package anchors in cross-repo lookups.
          role: shared-library

  python:
    # G3 (tier-1 language coverage parity) declared the python corpora
    # slot. SHAs below are pinned to the latest tagged stable release
    # of each upstream repo at pin time (bd xap6); bump only with an
    # accompanying issue that records the rationale.
    #   psf/black             -> 26.3.1               (2026-03-12)
    #   django/django         -> 6.0.5                (2026-05-05)
    #   pallets/flask         -> 3.1.3                (2026-02-19)
    #   encode/httpx          -> 0.28.1               (2024-12-06)
    #   python-poetry/poetry  -> 2.4.1                (2026-05-09)
    desktop:
      repo: github.com/psf/black
      url: https://github.com/psf/black
      sha: c6755bb741b6481d6b3d3bb563c83fa060db96c9  # tag 26.3.1, 2026-03-12
      description: Black code formatter; large self-contained Python project with mature test suite. Stand-in for "desktop monorepo" role until a more representative pin lands.
      representativeness: Substantial python codebase with classes, decorators, async functions, and a test/tests split that exercises criterion 1 (kind correctness) and criterion 6 (description coverage) once enrichment ships.
      language_files: null
      loc: null
    framework:
      repo: github.com/django/django
      url: https://github.com/django/django
      sha: 8f8ad09659d728423a00e0a3b5f16da5c3a38e24  # tag 6.0.5, 2026-05-05
      description: Django web framework; the canonical "framework-heavy" python monorepo with ORM models, routes (urlpatterns), view classes, and an extensive contrib/ tree.
      representativeness: Exercises framework-strategy markers once per-framework strategies land (Django views + urlpatterns + ORM) and provides the canonical sample for criterion 3 measurement.
      language_files: null
      loc: null
    polyrepo:
      workspace_template: tests/fixtures/tier1/python-polyrepo/.weld/workspaces.yaml
      children:
        - repo: github.com/pallets/flask
          url: https://github.com/pallets/flask
          sha: 22d924701a6ae2e4cd01e9a15bbaf3946094af65  # tag 3.1.3, 2026-02-19
          description: Flask micro-framework; small enough to keep federation discovery fast in CI.
          role: framework-app
        - repo: github.com/encode/httpx
          url: https://github.com/encode/httpx
          sha: 26d48e0634e6ee9cdc0533996db289ce4b430177  # tag 0.28.1, 2024-12-06
          description: HTTPX client; depends on package set that overlaps with Flask's runtime surface for cross-repo resolution.
          role: shared-library
        - repo: github.com/python-poetry/poetry
          url: https://github.com/python-poetry/poetry
          sha: 811a12dae0fe81f199e3f1b88b8b8be9eed543c2  # tag 2.4.1, 2026-05-09
          description: Poetry CLI; multi-package python repo with src-layout that stresses package node minting.
          role: desktop-app

  cpp:
    # G3 (tier-1 language coverage parity) declared the C++ corpora
    # slot. SHAs below are pinned to the latest tagged stable release
    # of each upstream repo at pin time (bd xap6); bump only with an
    # accompanying issue that records the rationale.
    #   Kitware/CMake       -> v4.3.2     (2026-04-21)
    #   grpc/grpc           -> v1.80.0    (2026-03-24)
    #   abseil/abseil-cpp   -> 20260107.1 (2026-02-11)
    #   google/googletest   -> v1.17.0    (2025-04-30)
    #   nlohmann/json       -> v3.12.0    (2025-04-11)
    desktop:
      repo: github.com/Kitware/CMake
      url: https://github.com/Kitware/CMake
      sha: 8d3c68cc0f36108f7ebb23ba7a6bc08b9b1d81e4  # tag v4.3.2, 2026-04-21
      description: CMake itself; large C++ codebase exercising namespaces, classes, templates, and a substantial in-tree test suite. Stand-in for "desktop monorepo" until a more representative pin lands.
      representativeness: Large enough to surface cpp_libclang's compile-commands path and cpp_cmake's project / build-target node minting under one umbrella.
      language_files: null
      loc: null
    framework:
      repo: github.com/grpc/grpc
      url: https://github.com/grpc/grpc
      sha: f5e2d6e856176c2f6b7691032adfefe21e5f64c1  # tag v1.80.0, 2026-03-24
      description: gRPC C++ runtime + framework; canonical "framework-heavy" C++ corpus with protobuf services, multi-target CMake build, and per-language testing infrastructure.
      representativeness: Exercises framework-strategy markers once per-framework strategies land (gRPC services + protobuf bindings) and stresses the cpp_cmake build-target graph.
      language_files: null
      loc: null
    polyrepo:
      workspace_template: tests/fixtures/tier1/cpp-polyrepo/.weld/workspaces.yaml
      children:
        - repo: github.com/abseil/abseil-cpp
          url: https://github.com/abseil/abseil-cpp
          sha: 255c84dadd029fd8ad25c5efb5933e47beaa00c7  # tag 20260107.1, 2026-02-11
          description: Abseil C++ common libraries; widely-depended-on by other C++ projects so cross-repo package resolution has a real target.
          role: shared-library
        - repo: github.com/google/googletest
          url: https://github.com/google/googletest
          sha: 52eb8108c5bdec04579160ae17225d66034bd723  # tag v1.17.0, 2025-04-30
          description: GoogleTest framework; small enough to keep federation discovery fast and exercises the test-framework signal path.
          role: framework-app
        - repo: github.com/nlohmann/json
          url: https://github.com/nlohmann/json
          sha: 55f93686c01528224f448c19128836e7df245f72  # tag v3.12.0, 2025-04-11
          description: nlohmann/json header-only library; smallest C++ corpus that still exposes class / namespace symbols and an extensive test directory.
          role: desktop-app

  java:
    # G3 (tier-1 language coverage parity) declared the Java corpora
    # slot. SHAs below are pinned to the latest tagged stable release
    # of each upstream repo at pin time (bd xap6); bump only with an
    # accompanying issue that records the rationale.
    #   google/guava                  -> v33.6.0              (2026-04-14)
    #   spring-projects/spring-boot   -> v4.0.6               (2026-04-23)
    #   junit-team/junit5             -> r6.0.3               (2026-02-15)
    #   google/gson                   -> gson-parent-2.14.0   (2026-04-23)
    #   apache/commons-lang           -> commons-lang-3.20.0  (2025-11-12)
    desktop:
