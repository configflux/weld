# CI workflow for weld
# Runs Bazel build + test on push to main and PRs.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install tree-sitter Python bindings
        # Several bench tests gate on _is_tree_sitter_available() and
        # skip when the umbrella + grammar packages are absent. Install
        # them here so the runner exercises the tree-sitter-present
        # path (vs. silently skipping).
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            tree-sitter \
            tree-sitter-python \
            tree-sitter-typescript \
            tree-sitter-go \
            tree-sitter-rust \
            tree-sitter-cpp \
            tree-sitter-c-sharp \
            tree-sitter-java

      - name: Mount Bazel cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/bazel-disk
            ~/.cache/bazel-repo
          key: bazel-${{ runner.os }}-${{ hashFiles('MODULE.bazel', 'MODULE.bazel.lock', '.bazelrc') }}
          restore-keys: |
            bazel-${{ runner.os }}-

      - name: Prepare cache directories
        run: |
          mkdir -p ~/.cache/bazel-disk
          mkdir -p ~/.cache/bazel-repo

      - name: Build
        run: |
          bazelisk \
            --output_user_root="${HOME}/.cache/bazel-repo" \
            build \
            --disk_cache="${HOME}/.cache/bazel-disk" \
            //...

      - name: Test
        run: |
          bazelisk \
            --output_user_root="${HOME}/.cache/bazel-repo" \
            test \
            --disk_cache="${HOME}/.cache/bazel-disk" \
            //...
